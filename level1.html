<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level 1 — Makin' Meatballs</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="level-body level-one">
  <main id="levelRoot" class="level-root">
    <div class="level-bg" style="background-image: url('song1/bg.png')"></div>
    <div class="soft-bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <section class="level-hud">
      <a class="tiny-link" href="index.html">Menu</a>
      <span class="level-name">Level 1 · Makin' Meatballs</span>
      <span id="liveScore" class="live-score">0</span>
    </section>

    <img id="girl" class="sprite girl-sprite" src="song1/e1.png" alt="Girl with spatula" />
    <img id="catcher" class="sprite catcher-sprite" src="song1/c1.png" alt="Meatball catcher" />
    <div id="meatballLayer" class="meatball-layer"></div>

    <div id="judgement" class="judgement-flash" aria-live="polite"></div>
    <div id="countdown" class="countdown"></div>
    <div id="startOverlay" class="start-overlay">
      <h1>Makin' Meatballs</h1>
      <p>Press space near on the beat to catch the meatballs.</p>
      <button id="startButton" type="button">Start level</button>
    </div>
    <div id="whiteFade" class="white-fade visible"></div>
    <section id="resultsOverlay" class="results-overlay" aria-live="polite"></section>
  </main>

  <script src="js/midi.js"></script>
  <script src="js/common.js"></script>
  <script src="js/level-core.js"></script>
  <script src="js/level1.js"></script>
</body>
</html>
