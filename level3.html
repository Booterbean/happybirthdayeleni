<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level 3 — RoboSubbing</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="level-body level-three">
  <main id="levelRoot" class="level-root">
    <div class="level-bg" style="background-image: url('song3/bg.png')"></div>
    <div class="soft-bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <section class="level-hud">
      <a class="tiny-link" href="index.html">Menu</a>
      <span class="level-name">Level 3 · RoboSubbing</span>
      <span id="liveScore" class="live-score">0</span>
    </section>

    <img id="engineer" class="sprite engineer-sprite" src="song3/e.png" alt="Girl with remote" />
    <img id="robot" class="sprite robot-sprite" src="song3/r.png" alt="Robot submarine" />

    <div id="judgement" class="judgement-flash" aria-live="polite"></div>
    <div id="countdown" class="countdown"></div>
    <div id="startOverlay" class="start-overlay">
      <h1>RoboSubbing</h1>
      <p>Press space to flip the sub on beat.</p>
      <button id="startButton" type="button">Start level</button>
    </div>
    <div id="whiteFade" class="white-fade visible"></div>
    <section id="resultsOverlay" class="results-overlay" aria-live="polite"></section>
  </main>

  <script src="js/midi.js"></script>
  <script src="js/common.js"></script>
  <script src="js/level-core.js"></script>
  <script src="js/level3.js"></script>
</body>
</html>
